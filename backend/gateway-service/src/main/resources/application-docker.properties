spring.application.name=gateway-service
server.port=8080

# Eureka Client
eureka.instance.hostname=eureka-server
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.config.import= optional:configserver://localhost:8888

spring.cloud.gateway.server.webflux.routes[0].id=account-API
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8090
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=inclusive/api/v1/form/**, inclusive/api/v1/profile/**

spring.cloud.gateway.server.webflux.routes[1].id=location-api
spring.cloud.gateway.server.webflux.routes[1].uri=lb://location-api
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/inclusive/api/v1/location/**, inclusive/api/v1/incidence/**, inclusive/api/v1/place/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AuthenticationFilter

spring.cloud.gateway.server.webflux.routes[2].id=route-api
spring.cloud.gateway.server.webflux.routes[2].uri=lb://route-api
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/inclusive/api/v1/route/**, inclusive/api/v1/incidence/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthenticationFilter


spring.cloud.gateway.server.webflux.routes[3].id=authentication-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://authentication-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/inclusive/api/v1/account/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=AuthenticationFilter

#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https:// www.googleapis.com/service_accounts/v1/jwk/securetoken%40system.gserviceaccount.com
firebasepath=${FIREBASEPATH}


