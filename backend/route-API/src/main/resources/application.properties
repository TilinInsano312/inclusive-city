spring.application.name=route-API
server.port=8060
spring.config.import= optional:configserver://localhost:8888

#mongodb configuration
spring.data.mongodb.uri=mongodb://admin:admin@localhost:27017/inclusivedb?authSource=admin
spring.data.mongodb.host=inclusive_db
spring.data.mongodb.database=inclusivedb
spring.data.mongodb.username=admin
spring.data.mongodb.password=admin
spring.data.mongodb.port=27017
spring.data.mongodb.auto-index-creation=true

#eureka client configuration
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:8761/eureka/

spring.cloud.config.import-check.enabled=false

#google.maps.api.key=${GOOGLE_MAPS_API_KEY}
#here.api.key=${HERE_API_KEY}

# OpenRouteService API (ruta segura que evita incidencias)
ors.api.key=${ORS_API_KEY}
ors.api.url=https://api.openrouteservice.org/v2/directions/foot-walking