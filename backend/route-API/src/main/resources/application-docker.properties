spring.application.name=route-api
server.port=8060

# MongoDB Pruebas
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# Eureka Client
eureka.instance.hostname=eureka-server
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.security.oauth2.resourceserver.jwt.jws-algorithms=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWS_ALGORITHMS}


google.maps.api.key=${GOOGLE_MAPS_API_KEY}
spring.cloud.gcp.pubsub.credentials.location=file:/app/gcp-credentials.json
spring.cloud.gcp.project-id=${SPRING_CLOUD_GCP_PROJECT_ID}
spring.cloud.gcp.vision.enabled=true
spring.cloud.gcp.credentials.location=file:/app/gcp-credentials.json
spring.cloud.gcp.vision.credentials.default-scopes=https://www.googleapis.com/auth/cloud-platform
firebasepath=${FIREBASEPATH}
here.api.key=${HERE_API_KEY}
spring.cloud.gcp.vision.ocr-document-and-async-enabled=false