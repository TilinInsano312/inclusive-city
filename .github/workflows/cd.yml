name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de despliegue
        required: true
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tilininsano312/inclusive-city

jobs:
  # ─── Guarda de CI ────────────────────────────────────────────────────────────
  # Si el CD fue disparado por workflow_run, solo continúa si el CI pasó.
  # Si fue disparado manualmente (workflow_dispatch), siempre continúa.
  guard:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed or manual dispatch — proceeding."

  # ─── Resolución de entorno ───────────────────────────────────────────────────
  resolve-env:
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      deploy_environment: ${{ steps.target.outputs.deploy_environment }}
      image_tag: ${{ steps.target.outputs.image_tag }}

    steps:
      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ inputs.environment }}"
          elif [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            DEPLOY_ENV="prod"
          else
            DEPLOY_ENV="dev"
          fi

          if [ "$DEPLOY_ENV" = "prod" ]; then
            IMAGE_TAG="latest"
          else
            IMAGE_TAG="dev-latest"
          fi

          echo "deploy_environment=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ─── Build y push de imágenes ────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: resolve-env
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: eureka-server
            dockerfile: eureka-server/Dockerfile
          - name: gateway-service
            dockerfile: gateway-service/Dockerfile
          - name: route-api
            dockerfile: route-API/Dockerfile
          - name: location-api
            dockerfile: location-API/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ needs.resolve-env.outputs.image_tag }}
            type=sha,prefix=${{ needs.resolve-env.outputs.deploy_environment }}-sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─── Deploy en VPS ───────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs:
      - resolve-env
      - build-and-push
    environment: ${{ needs.resolve-env.outputs.deploy_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync docker-compose to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: docker-compose.yml
          remote_path: ${{ secrets.VPS_DEPLOY_PATH }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: ${{ secrets.VPS_SSH_PORT }}
          remote_user: ${{ secrets.VPS_SSH_USER }}
          remote_key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            export EUREKA_SERVER_IMAGE="${{ env.IMAGE_PREFIX }}/eureka-server:${{ needs.resolve-env.outputs.image_tag }}"
            export GATEWAY_SERVICE_IMAGE="${{ env.IMAGE_PREFIX }}/gateway-service:${{ needs.resolve-env.outputs.image_tag }}"
            export ROUTE_API_IMAGE="${{ env.IMAGE_PREFIX }}/route-api:${{ needs.resolve-env.outputs.image_tag }}"
            export LOCATION_API_IMAGE="${{ env.IMAGE_PREFIX }}/location-api:${{ needs.resolve-env.outputs.image_tag }}"
            printf '%s' "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose pull eureka-server gateway-service route-api location-api
            docker compose up -d --no-build inclusive-mongodb eureka-server gateway-service route-api location-api
            docker logout ghcr.io
            docker image prune -f
