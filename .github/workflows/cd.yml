name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de despliegue
        required: true
        type: choice
        options:
          - dev
          - production
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tilininsano312/inclusive-city

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      deploy_environment: ${{ steps.target.outputs.deploy_environment }}
      image_tag: ${{ steps.target.outputs.image_tag }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: eureka-server
            dockerfile: eureka-server/Dockerfile
          - name: gateway-service
            dockerfile: gateway-service/Dockerfile
          - name: route-api
            dockerfile: route-API/Dockerfile
          - name: location-api
            dockerfile: location-API/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            DEPLOY_ENV="production"
          else
            DEPLOY_ENV="dev"
          fi

          if [ "$DEPLOY_ENV" = "production" ]; then
            IMAGE_TAG="latest"
          else
            IMAGE_TAG="dev-latest"
          fi

          echo "deploy_environment=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ steps.target.outputs.image_tag }}
            type=sha,prefix=${{ steps.target.outputs.deploy_environment }}-sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ needs.build-and-push.outputs.deploy_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync docker-compose to VPS
        run: |
          rsync -avz -e "ssh -p ${{ secrets.VPS_SSH_PORT }}" \
            ./docker-compose.yml \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}/docker-compose.yml"

      - name: Deploy on VPS
        run: |
          ssh -p "${{ secrets.VPS_SSH_PORT }}" "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_HOST }}" <<EOT
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            export EUREKA_SERVER_IMAGE="${{ env.IMAGE_PREFIX }}/eureka-server:${{ needs.build-and-push.outputs.image_tag }}"
            export GATEWAY_SERVICE_IMAGE="${{ env.IMAGE_PREFIX }}/gateway-service:${{ needs.build-and-push.outputs.image_tag }}"
            export ROUTE_API_IMAGE="${{ env.IMAGE_PREFIX }}/route-api:${{ needs.build-and-push.outputs.image_tag }}"
            export LOCATION_API_IMAGE="${{ env.IMAGE_PREFIX }}/location-api:${{ needs.build-and-push.outputs.image_tag }}"
            printf '%s' "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose pull eureka-server gateway-service route-api location-api
            docker compose up -d --no-build inclusive-mongodb eureka-server gateway-service route-api location-api
            docker logout ghcr.io
            docker image prune -f
          EOT
